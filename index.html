<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mortgage Extra Payment Payoff Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4">
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold text-center mb-2 text-blue-400">Mortgage Extra Payment Simulator</h1>
  <p class="text-center text-gray-400 text-sm mb-2 italic">Educational tool — not financial advice</p>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
    <div>
      <label for="principal" class="block text-xs text-gray-400 mb-1">Loan Amount ($)</label>
      <input type="number" id="principal" value="400000" class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm" aria-label="Loan amount">
    </div>
    <div>
      <label for="rate" class="block text-xs text-gray-400 mb-1">Annual Interest Rate (%)</label>
      <input type="number" id="rate" value="6.5" step="0.1" class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm" aria-label="Annual interest rate">
    </div>
    <div>
      <label for="term" class="block text-xs text-gray-400 mb-1">Loan Term (months)</label>
      <input type="number" id="term" value="360" class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm" aria-label="Loan term in months">
    </div>
  </div>

  <div class="mb-4 bg-gray-800 rounded p-4">
    <label for="extra" class="block text-sm font-medium text-gray-300 mb-2">
      Extra Monthly Payment: <span id="extraVal" class="text-blue-300 font-bold">$0</span>
    </label>
    <input type="range" id="extra" min="0" max="2000" step="50" value="0" class="w-full accent-blue-500" aria-label="Extra monthly payment">
  </div>

  <button onclick="calculate()" class="w-full bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded font-medium mb-4">Calculate</button>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4" id="stats"></div>

  <canvas id="chart" aria-label="Mortgage balance over time"></canvas>
</div>

<script>
let chart = null;
document.getElementById('extra').oninput = e => {
  document.getElementById('extraVal').textContent = '$' + e.target.value;
  calculate();
};
['principal','rate','term'].forEach(id => document.getElementById(id).addEventListener('input', calculate));

function amortize(principal, monthlyRate, totalMonths, extraPayment) {
  let balance = principal;
  const basePayment = monthlyRate > 0
    ? principal * monthlyRate * Math.pow(1+monthlyRate,totalMonths) / (Math.pow(1+monthlyRate,totalMonths)-1)
    : principal / totalMonths;
  const payment = basePayment + extraPayment;
  let totalInterest = 0;
  const balances = [balance];
  let month = 0;

  while (balance > 0 && month < totalMonths * 2) {
    const interest = balance * monthlyRate;
    totalInterest += interest;
    balance = balance + interest - payment;
    if (balance < 0) balance = 0;
    balances.push(balance);
    month++;
  }
  return { months: month, totalInterest, balances, basePayment };
}

function calculate() {
  const principal = parseFloat(document.getElementById('principal').value) || 400000;
  const rate = parseFloat(document.getElementById('rate').value) || 6.5;
  const term = parseInt(document.getElementById('term').value) || 360;
  const extra = parseFloat(document.getElementById('extra').value) || 0;
  const monthlyRate = rate / 100 / 12;

  const base = amortize(principal, monthlyRate, term, 0);
  const extra_ = amortize(principal, monthlyRate, term, extra);

  const savedMonths = base.months - extra_.months;
  const savedInterest = base.totalInterest - extra_.totalInterest;

  document.getElementById('stats').innerHTML = [
    { label: 'Base Monthly', value: '$' + base.basePayment.toFixed(0), color: 'text-gray-300' },
    { label: 'Payoff Time', value: extra_.months + ' mo', sub: savedMonths > 0 ? '−' + savedMonths + ' months' : '', color: 'text-blue-400' },
    { label: 'Total Interest (base)', value: '$' + (base.totalInterest/1000).toFixed(0)+'k', color: 'text-red-400' },
    { label: 'Interest Saved', value: '$' + (savedInterest/1000).toFixed(1)+'k', color: savedInterest > 0 ? 'text-green-400' : 'text-gray-400' },
  ].map(s => `
    <div class="bg-gray-800 rounded p-3 text-center">
      <div class="text-xs text-gray-400 mb-1">${s.label}</div>
      <div class="text-lg font-bold ${s.color}">${s.value}</div>
      ${s.sub ? `<div class="text-xs text-green-400">${s.sub}</div>` : ''}
    </div>
  `).join('');

  // Chart
  const maxMonths = Math.max(base.balances.length, extra_.balances.length);
  const labels = Array.from({length: maxMonths}, (_, i) => {
    const yr = Math.floor(i/12);
    return i % 12 === 0 ? yr + 'yr' : '';
  });

  const ctx = document.getElementById('chart').getContext('2d');
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Standard', data: base.balances, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.05)', borderWidth: 2, pointRadius: 0, fill: true },
        { label: 'With Extra $' + extra + '/mo', data: extra_.balances, borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.05)', borderWidth: 2, pointRadius: 0, fill: true },
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#e5e7eb' } } },
      scales: {
        y: { ticks: { color: '#9ca3af', callback: v => '$' + (v/1000).toFixed(0)+'k' }, grid: { color: '#374151' } },
        x: { ticks: { color: '#9ca3af', maxRotation: 0 }, grid: { color: '#1f2937' } }
      }
    }
  });
}

calculate();
</script>
</body>
</html>
